<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Shore Signal — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #111; --mid: #555; --gray: #888; --light: #bbb;
    --border: #e5e5e5; --bg: #fafaf9; --card: #fff;
    --brand: #2d5a7b; --brand-vivid: #3a7ca5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg); color: var(--black);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 32px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--mid); font-size: 14px; margin-top: 6px; }

  /* Login */
  .login {
    max-width: 380px; margin: 120px auto 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px;
  }
  .login h1 { font-size: 22px; margin-bottom: 6px; }
  .login p { color: var(--mid); font-size: 13px; margin-bottom: 20px; }
  .login form { display: flex; flex-direction: column; gap: 12px; }
  .login input {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font: inherit; outline: none;
  }
  .login input:focus { border-color: var(--brand-vivid); }
  .login button {
    background: var(--brand-vivid); color: white; border: none;
    padding: 12px 20px; border-radius: 10px; font: inherit;
    font-weight: 600; cursor: pointer;
  }
  .login button:hover { background: var(--brand); }
  .err { color: #b00020; font-size: 13px; min-height: 18px; }

  /* Dashboard */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
  }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    border: 1px solid var(--border); background: white;
    border-radius: 100px; padding: 10px 18px; font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
    color: var(--black); text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { border-color: var(--black); }
  .btn-primary { background: var(--brand-vivid); color: white; border-color: var(--brand-vivid); }
  .btn-primary:hover { background: var(--brand); border-color: var(--brand); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td {
    text-align: left; padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  th { background: #f6f5f3; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mid); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.email { font-weight: 600; }
  td.muted { color: var(--mid); font-size: 13px; }
  .empty { padding: 60px 24px; text-align: center; color: var(--mid); }
  .count { color: var(--mid); font-size: 13px; }

  .search {
    border: 1px solid var(--border); border-radius: 100px;
    padding: 10px 16px; font: inherit; font-size: 13px;
    outline: none; min-width: 240px;
  }
  .search:focus { border-color: var(--brand-vivid); }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    background: #efece8; border-radius: 100px; padding: 4px;
    width: fit-content;
  }
  .tab {
    border: none; background: transparent; padding: 8px 18px;
    border-radius: 100px; font: inherit; font-size: 13px;
    font-weight: 600; color: var(--mid); cursor: pointer;
  }
  .tab.active { background: white; color: var(--black); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  td.wrap-cell { white-space: pre-wrap; word-break: break-word; max-width: 320px; }
  .detail-btn {
    border: 1px solid var(--border); background: white;
    border-radius: 8px; padding: 4px 10px; font: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .detail-btn:hover { border-color: var(--black); }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 28px 32px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .modal .meta { color: var(--mid); font-size: 13px; margin-bottom: 20px; }
  .modal dl { display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; font-size: 14px; }
  .modal dt { font-weight: 600; color: var(--mid); }
  .modal dd { color: var(--black); white-space: pre-wrap; word-break: break-word; }
  .modal .close { float: right; margin-top: -8px; }
</style>
</head>
<body>

<div id="login-view" class="wrap" style="display:none;">
  <div class="login">
    <h1>Admin</h1>
    <p>Enter the admin password to view leads.</p>
    <form id="login-form">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>
</div>

<div id="dash-view" class="wrap" style="display:none;">
  <div class="top">
    <div>
      <h1 id="view-title">Leads</h1>
      <div class="sub"><span id="lead-count" class="count">0 leads</span></div>
    </div>
    <div class="actions">
      <input type="search" class="search" id="search" placeholder="Search...">
      <button class="btn" id="refresh-btn">Refresh</button>
      <button class="btn btn-primary" id="download-btn">Download CSV</button>
      <button class="btn" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="leads" type="button">Leads</button>
    <button class="tab" data-tab="intakes" type="button">Intakes</button>
  </div>

  <div class="card" id="leads-card">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Source</th>
          <th>Submitted</th>
          <th>IP</th>
        </tr>
      </thead>
      <tbody id="lead-tbody"></tbody>
    </table>
    <div class="empty" id="empty-state" style="display:none;">No leads yet.</div>
  </div>

  <div class="card" id="intakes-card" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>Submitted</th>
          <th>Name</th>
          <th>Brand</th>
          <th>Email</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="intake-tbody"></tbody>
    </table>
    <div class="empty" id="intake-empty" style="display:none;">No intakes yet.</div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>
(function () {
  const PW_KEY = 'shoresignal_admin_pw';
  const loginView = document.getElementById('login-view');
  const dashView = document.getElementById('dash-view');
  const loginForm = document.getElementById('login-form');
  const pwInput = document.getElementById('pw');
  const loginErr = document.getElementById('login-err');
  const tbody = document.getElementById('lead-tbody');
  const emptyEl = document.getElementById('empty-state');
  const intakeTbody = document.getElementById('intake-tbody');
  const intakeEmpty = document.getElementById('intake-empty');
  const leadsCard = document.getElementById('leads-card');
  const intakesCard = document.getElementById('intakes-card');
  const countEl = document.getElementById('lead-count');
  const titleEl = document.getElementById('view-title');
  const searchEl = document.getElementById('search');
  const refreshBtn = document.getElementById('refresh-btn');
  const downloadBtn = document.getElementById('download-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const tabs = document.querySelectorAll('.tab');
  const modalBg = document.getElementById('modal-bg');
  const modal = document.getElementById('modal');

  let activeTab = 'leads';
  let allLeads = [];
  let allIntakes = [];

  function getPw() { return sessionStorage.getItem(PW_KEY); }
  function setPw(v) { sessionStorage.setItem(PW_KEY, v); }
  function clearPw() { sessionStorage.removeItem(PW_KEY); }

  function showLogin() {
    dashView.style.display = 'none';
    loginView.style.display = 'block';
    setTimeout(() => pwInput.focus(), 0);
  }
  function showDash() {
    loginView.style.display = 'none';
    dashView.style.display = 'block';
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString(); }
    catch { return iso; }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderLeads(leads) {
    tbody.innerHTML = '';
    if (!leads.length) {
      emptyEl.style.display = 'block';
      countEl.textContent = '0 leads';
      return;
    }
    emptyEl.style.display = 'none';
    countEl.textContent = leads.length + ' lead' + (leads.length === 1 ? '' : 's');
    tbody.innerHTML = leads.map((l) => `
      <tr>
        <td class="email">${esc(l.email)}</td>
        <td class="muted">${esc(l.source || '')}</td>
        <td class="muted">${esc(fmtDate(l.createdAt))}</td>
        <td class="muted">${esc(l.ip || '')}</td>
      </tr>
    `).join('');
  }

  function renderIntakes(intakes) {
    intakeTbody.innerHTML = '';
    if (!intakes.length) {
      intakeEmpty.style.display = 'block';
      countEl.textContent = '0 intakes';
      return;
    }
    intakeEmpty.style.display = 'none';
    countEl.textContent = intakes.length + ' intake' + (intakes.length === 1 ? '' : 's');
    intakeTbody.innerHTML = intakes.map((it, idx) => `
      <tr>
        <td class="muted">${esc(fmtDate(it.createdAt))}</td>
        <td>${esc(it.name || '')}</td>
        <td>${esc(it.brand_name || '')}</td>
        <td class="email">${esc(it.email || '')}</td>
        <td><button class="detail-btn" data-idx="${idx}">View</button></td>
      </tr>
    `).join('');
  }

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    if (activeTab === 'leads') {
      const list = !q ? allLeads : allLeads.filter((l) =>
        (l.email || '').toLowerCase().includes(q) ||
        (l.source || '').toLowerCase().includes(q)
      );
      renderLeads(list);
    } else {
      const list = !q ? allIntakes : allIntakes.filter((it) =>
        (it.email || '').toLowerCase().includes(q) ||
        (it.name || '').toLowerCase().includes(q) ||
        (it.brand_name || '').toLowerCase().includes(q)
      );
      renderIntakes(list);
    }
  }

  async function authFetch(path) {
    const pw = getPw();
    if (!pw) { showLogin(); return null; }
    const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + pw } });
    if (res.status === 401) {
      clearPw();
      showLogin();
      loginErr.textContent = 'Session expired. Sign in again.';
      return null;
    }
    return res;
  }

  async function fetchLeads() {
    const res = await authFetch('/api/admin/list');
    if (!res) return;
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'Failed to load leads.');
      return;
    }
    const data = await res.json();
    allLeads = data.leads || [];
    if (activeTab === 'leads') applyFilter();
  }

  async function fetchIntakes() {
    const res = await authFetch('/api/admin/intakes-list');
    if (!res) return;
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'Failed to load intakes.');
      return;
    }
    const data = await res.json();
    allIntakes = data.intakes || [];
    if (activeTab === 'intakes') applyFilter();
  }

  function refreshActive() {
    return activeTab === 'leads' ? fetchLeads() : fetchIntakes();
  }

  function switchTab(name) {
    activeTab = name;
    tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    if (name === 'leads') {
      leadsCard.style.display = '';
      intakesCard.style.display = 'none';
      titleEl.textContent = 'Leads';
      searchEl.placeholder = 'Search email or source...';
    } else {
      leadsCard.style.display = 'none';
      intakesCard.style.display = '';
      titleEl.textContent = 'Intakes';
      searchEl.placeholder = 'Search name, brand, or email...';
    }
    searchEl.value = '';
    applyFilter();
    refreshActive();
  }

  function openIntakeDetail(it) {
    const fields = [
      ['Submitted', fmtDate(it.createdAt)],
      ['Name', it.name],
      ['Email', it.email],
      ['Brand', it.brand_name],
      ['Website / socials', it.website],
      ['Product & customer', it.product_and_customer],
      ['Currently working with creators', it.current_creators],
      ['Current method', it.current_method],
      ['Biggest pain point', it.pain_point],
      ['Success looks like', Array.isArray(it.goals) ? it.goals.join(', ') : (it.goals || '')],
      ['Timeline', it.timeline],
      ['Anything else', it.anything_else],
      ['IP', it.ip],
    ];
    modal.innerHTML = `
      <button class="btn close" id="modal-close" type="button">Close</button>
      <h2>${esc(it.brand_name || it.name || it.email)}</h2>
      <div class="meta">${esc(fmtDate(it.createdAt))}</div>
      <dl>
        ${fields.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v || '—')}</dd>`).join('')}
      </dl>
    `;
    modalBg.classList.add('show');
    document.getElementById('modal-close').addEventListener('click', closeModal);
  }
  function closeModal() { modalBg.classList.remove('show'); }
  modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });

  intakeTbody.addEventListener('click', (e) => {
    const b = e.target.closest('.detail-btn');
    if (!b) return;
    const idx = parseInt(b.dataset.idx, 10);
    if (!Number.isNaN(idx) && allIntakes[idx]) openIntakeDetail(allIntakes[idx]);
  });

  tabs.forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginErr.textContent = '';
    const pw = pwInput.value;
    const res = await fetch('/api/admin/list', {
      headers: { 'Authorization': 'Bearer ' + pw },
    });
    if (res.ok) {
      setPw(pw);
      pwInput.value = '';
      showDash();
      const data = await res.json();
      allLeads = data.leads || [];
      fetchIntakes();
      applyFilter();
    } else if (res.status === 401) {
      loginErr.textContent = 'Wrong password.';
    } else {
      const data = await res.json().catch(() => ({}));
      loginErr.textContent = data.error || 'Sign-in failed.';
    }
  });

  refreshBtn.addEventListener('click', refreshActive);
  searchEl.addEventListener('input', applyFilter);
  logoutBtn.addEventListener('click', () => { clearPw(); showLogin(); });

  downloadBtn.addEventListener('click', async () => {
    const path = activeTab === 'leads' ? '/api/admin/csv' : '/api/admin/intakes-csv';
    const filePrefix = activeTab === 'leads' ? 'shore-signal-leads' : 'shore-signal-intakes';
    const res = await authFetch(path);
    if (!res) return;
    if (!res.ok) { alert('Download failed.'); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0, 10);
    a.download = `${filePrefix}-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  if (getPw()) {
    showDash();
    fetchLeads();
    fetchIntakes();
  } else {
    showLogin();
  }
})();
</script>

</body>
</html>
